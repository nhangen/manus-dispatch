# Manus Research plugin config.
# Copy to ~/.config/manus-dispatch/config.toml and edit.

# Manus API key. Either set api_key directly, or set api_key_cmd to a shell
# command that prints the key on stdout (e.g. for keychain integration).
# Exactly one must be set.
api_key = "manus-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
# api_key_cmd = "security find-generic-password -s manus-api -w"

# Obsidian filing. When enabled, the vault path is read from the
# nhangen/obsidian plugin's local config (~/.claude/plugins/cache/nhangen/
# obsidian/<latest>/obsidian.local.md, `vault_path:` frontmatter). No
# hardcoded path in this plugin.
#
# Requires the nhangen/obsidian plugin to be installed and configured. If
# you set obsidian_enabled = true but the plugin is not present, the next
# manus-client invocation will emit a diagnostic and skip filing.
obsidian_enabled = false

# Soft daily credit warning. The plugin does NOT enforce this — it surfaces
# a warning in /manus-dispatch output when today's spend exceeds the cap.
# Set to 0 to disable.
daily_credit_cap = 0
